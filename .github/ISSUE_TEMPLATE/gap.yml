name: AdulaJS gap
description: A capability AdulaJS lacks. Describe AdulaJS, not your project.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Report only what AdulaJS itself should offer. Reproduce it on a new system
        from `npx create-adulajs`, not on your project, and leave out project names,
        records and credentials. `node ace adula:gaps report` opens this form prefilled
        from your GAPS.md. A gap outside AdulaJS's scope is closed as not planned.
  - type: input
    id: package
    attributes:
      label: Package
      description: Package and version, for example `adula 1.0.0`.
    validations:
      required: true
  - type: textarea
    id: needed
    attributes:
      label: Needed by
      description: AdulaJS capability that is missing, stated without project details.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Tried
      description: AdulaJS extension points you tried.
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: Blocked because
      description: Why none of them works.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed AdulaJS change
      description: The API, option or fix AdulaJS should offer.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps on a new system from create-adulajs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The test that would prove the gap is closed.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What the project does meanwhile, or none.
