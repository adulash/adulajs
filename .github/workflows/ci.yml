name: CI
on:
  # Branch pushes other than main run through their pull request only.
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: adula_test
          POSTGRES_USER: adula
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adula -d adula_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://adula:ci-only-password@127.0.0.1:5432/adula_test
      NODE_ENV: test
      APP_KEY: ci-only-key-never-use-in-a-deployment-12345
      APP_URL: http://127.0.0.1:3334
      HOST: 127.0.0.1
      PORT: 3334
      LOG_LEVEL: silent
      SESSION_DRIVER: memory
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: adula
      DB_PASSWORD: ci-only-password
      DB_DATABASE: adula_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DRIVE_DISK: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # The revision is recorded in the original cached GitHub archive's pax comment.
      - name: Check out the official consumer fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adonisjs/starter-kits
          ref: 7e1c7930ec260ea38c3eb394eb192e05c12d3f7b
          path: .work/starter-kits-main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 11.19.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - name: Use PostgreSQL 17 backup and restore clients
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            . /etc/os-release
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adula/reference exec playwright install --with-deps chromium --only-shell
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm test
      - name: Retain browser traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/reference/tmp/browser-traces
          if-no-files-found: ignore
      - run: pnpm test:release
      - run: pnpm test:consumer
      # Genuine upgrade: the consumer starts on a version published to npm.
      - run: pnpm test:upgrade --published=1.2.0
      - run: pnpm --filter create-adulajs pack --pack-destination "$GITHUB_WORKSPACE/.work"
      - run: pnpm test:create --reuse-packages
      - run: pnpm test:create --docker --reuse-packages
      - run: pnpm check:release --artifacts=.work
      - run: pnpm check:boundaries
      - run: pnpm audit --prod --audit-level high
      - name: Retain the exact consumer-tested packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages-${{ github.run_id }}
          path: |
            .work/adula-[0-9]*.tgz
            .work/adula-ui-*.tgz
            .work/create-adulajs-*.tgz
            .work/SHA256SUMS
          if-no-files-found: error
          # Only the four allowlisted artifact paths above are uploaded. The
          # parent .work directory is hidden and contains other private fixtures.
          include-hidden-files: true
          retention-days: 14
