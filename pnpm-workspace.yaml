packages:
  - packages/*
  - apps/*
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@parcel/watcher': true
  argon2: true
  msgpackr-extract: false
  exifreader: false
minimumReleaseAgeExclude:
  - lucide-react@1.47.0
overrides:
  eslint-plugin-react>eslint: 10.9.0
  monaco-editor>dompurify: 3.4.17
  node-cron>uuid: 11.1.1
  "@adonisjs/mail>nodemailer": 10.0.12
  "@queuedash/api>zod": ^4.6.7
  "@queuedash/ui>zod": ^4.6.7
  axios: ^1.20.0
  express>body-parser: ^2.4.0
  follow-redirects: ^1.16.2
  source-map-js: ^1.2.2
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release yet (3.0.4 is not published); reached only through
    # AdonisJS build tooling (assembler > fast-glob > micromatch). Remove when braces 3.0.4 ships. Issue #80.
    - GHSA-vfj7-8cjw-p6xm
